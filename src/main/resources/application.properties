spring.application.name=JARVIS

# Select AI provider
# Local: ollama
# Render: openai
spring.ai.model.chat=${AI_PROVIDER:ollama}

# =========================
# Local Ollama + Qwen
# =========================
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:qwen2.5:1.5b}

# =========================
# OpenRouter (Cloud)
# =========================
spring.ai.openai.api-key=${OPENROUTER_API_KEY:}
spring.ai.openai.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
spring.ai.openai.chat.options.model=${OPENROUTER_MODEL:openai/gpt-oss-20b:free}
